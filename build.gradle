plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'top.ilay.oidcserver'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    compileOnly 'com.nimbusds:nimbus-jose-jwt:10.9'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.nimbusds:nimbus-jose-jwt:10.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26.0'
    externalUrl = 'http://127.0.0.1:8092'
    port = 8092
    containerName = 'halo-oidc-server-dev'
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('check') { dependsOn project(':ui').tasks.named('check') }

haloPlugin {
    openApi {
        useExistingServer = true
        groupingRules {
            oidcServer {
                displayName = 'OIDC Server API'
                pathsToMatch = ['/apis/console.api.oidc-server.halo.run/v1alpha1/**',
                                '/apis/uc.api.oidc-server.halo.run/v1alpha1/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/oidcServer': 'oidcServer.json']
        generator { outputDir = file("${projectDir}/ui/src/api/generated") }
    }
}
