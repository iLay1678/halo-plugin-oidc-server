apiVersion: v1alpha1
kind: Setting
metadata:
  name: oidc-server-settings
spec:
  forms:
    - group: security
      label: 服务开关
      formSchema:
        - $formkit: checkbox
          name: enabled
          label: 启用 OIDC 服务
          value: false
          help: 启用前请在 Halo 基础设置中配置固定外部访问地址。配置缺失或加载失败时拒绝授权与令牌请求。
    - group: protocol
      label: 令牌有效期
      formSchema:
        - $formkit: number
          name: codeSeconds
          label: 授权码有效期（秒）
          value: 120
          validation: required|min:30|max:300
        - $formkit: number
          name: accessSeconds
          label: 访问令牌有效期（秒）
          value: 900
          validation: required|min:60|max:3600
        - $formkit: number
          name: idSeconds
          label: ID Token 有效期（秒）
          value: 900
          validation: required|min:60|max:3600
        - $formkit: number
          name: refreshDays
          label: 刷新令牌族最长有效期（天）
          value: 30
          validation: required|min:1|max:90
